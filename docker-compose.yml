# KenLens production stack.
#
# Self-contained: run it on its own, from the directory it lives in.
#
#   docker compose up -d
#
# Four services — kenlens-server, PostgreSQL/TimescaleDB, Mosquitto and chrony (NTP for the
# anchors). No Seq (the server
# logs to ./logs in Production), no config-executor (a device simulator) and no serial
# bridge. Development uses the repository-root docker-compose.yml instead; the two share
# nothing.
#
# Every relative path below is relative to this file. Nothing under config/ is shipped:
# it is generated once per host (by kenlens-setup.sh) and never committed.
#
#   config/secrets/  db-password, jwt-key, mqtt-admin-password,
#                    cert-password, server-cert.pfx (web leaf), db-ca.crt (the KenLens CA)
#   config/tls/      postgres.crt + postgres.key, mqtt-broker.crt + mqtt-broker.key
#   config/ca/       the KenLens CA certificate and key — not mounted; keep the key backed up
#   config/anchor-ca/  anchor-console-ca.{crt,key}: an intermediate the CA signs, name-constrained
#                    to .local and the site's domains. The server signs anchor console
#                    certificates with it, so its key IS mounted (and the CA's is not).
#   config/dataprotection/  key-ring.crt + key-ring.key (RSA), which encrypt data/keys at rest
#   config/ntp/      the site's own time servers, if any, as *.sources files (see chrony/chrony.conf)
#
# data/keys/ is the server's key ring. It encrypts the MQTT password stored in the database,
# so a backup of the database without it (or without config/dataprotection/) restores
# everything except that password, which then has to be re-entered — for this bundled broker,
# with "Use the embedded broker" on the MQTT settings page, which makes the server a new one.
#
# Nothing here configures the broker the server connects to (issue #238). A database with no
# MQTT settings is given this bundled broker — mqtt-broker:8883, TLS, user kenlens, with a
# password the server makes up — and the MQTT settings page changes it from then on.
#
# The broker's users live in its data volume (kenlens-mosquitto-data), in the dynamic-security
# plugin's store; the server re-creates its own user and the anchor credentials in it at every
# start, from the database. kenlens-broker-control is how the server tells the broker whether
# the anonymous listener is on.
#
# Ownership matters, because the containers run as different users and two of them refuse
# a key anyone else can read:
#   - postgres.key: uid 70 (the image's postgres user), mode 0600.
#   - db-password: uid 70, 0400 — Postgres reads it as uid 70 and the server runs as root.
#   - mqtt-broker.key: uid 1883 (the image's mosquitto user), mode 0600.
#   - everything else in config/secrets/: 0400.
#
# One private KenLens CA signs all three leaf certificates, so the server trusts
# db-ca.crt for Postgres AND for the broker. No reverse proxy: Kestrel terminates web
# TLS on 8443, Mosquitto terminates MQTT TLS on 8883.

services:
  postgres:
    image: timescale/timescaledb:2.18.0-pg17
    restart: unless-stopped
    # TLS on, and required: pg_hba.conf has no plain `host` rule, so a network client
    # that does not negotiate TLS is refused. No host port — the compose network only.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/kenlens/tls/postgres.crt
      - -c
      - ssl_key_file=/kenlens/tls/postgres.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/kenlens/pg_hba.conf
    environment:
      POSTGRES_DB: kenlens
      POSTGRES_USER: kenlens
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      # Sizes timescaledb-tune's first-start tuning; written by kenlens-setup.sh. Without it the
      # image probes the memory cgroup, and where that is absent the first start fails.
      TS_TUNE_MEMORY: ${KENLENS_DB_TUNE_MEMORY:-}
    volumes:
      - kenlens-postgres-data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/kenlens/pg_hba.conf:ro
      - ./config/tls/postgres.crt:/kenlens/tls/postgres.crt:ro
      - ./config/tls/postgres.key:/kenlens/tls/postgres.key:ro
      - ./config/secrets/db-password:/run/secrets/db-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenlens -d kenlens"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    # mosquitto/start.sh writes the broker config: 8883 is TLS + password, its users managed
    # by the server through the dynamic-security plugin; 1883 is plain TCP and accepts
    # anonymous clients only while the anonymous listener is on. That switch is on the
    # server's MQTT settings page; MQTT_ANONYMOUS_LISTENER is only its first-start value.
    entrypoint: ["/kenlens/start.sh"]
    environment:
      MQTT_ANONYMOUS_LISTENER: ${MQTT_ANONYMOUS_LISTENER:-false}
    ports:
      - "8883:8883"
      - "1883:1883"
    volumes:
      - kenlens-mosquitto-data:/mosquitto/data
      - ./mosquitto/start.sh:/kenlens/start.sh:ro
      - ./config/tls/mqtt-broker.crt:/kenlens/tls/mqtt-broker.crt:ro
      - ./config/tls/mqtt-broker.key:/kenlens/tls/mqtt-broker.key:ro
      - kenlens-broker-control:/kenlens/control:ro
      # The plugin's admin: start.sh creates it on the data volume's first start, and the
      # healthcheck below logs in as it.
      - ./config/secrets/mqtt-admin-password:/kenlens/mqtt-admin-password:ro
      # Healthcheck only.
      - ./config/secrets/db-ca.crt:/kenlens/tls/ca.crt:ro
    healthcheck:
      # Probes the listener the server uses, as the plugin's admin: the server's own user
      # does not exist until the server has started and created it, and the server waits
      # for this check. --insecure only skips the host-name check (the certificate names
      # mqtt-broker, not localhost); the chain is still verified against the CA. `$$` keeps
      # `$SYS` and `$(...)` away from compose interpolation.
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h localhost -p 8883 --cafile /kenlens/tls/ca.crt --insecure
          -u kenlens-broker-admin -P "$$(cat /kenlens/mqtt-admin-password)" -t '$$SYS/#' -C 1 -W 3
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

  ntp:
    image: dockurr/chrony:4.9
    restart: unless-stopped
    # Anchors (firmware 0.7.0+) set their clock by SNTP to the broker's host, and check the
    # broker certificate's dates only once it is set (issue #232). chronyd runs with -x: it
    # serves time and never sets the host clock, so it needs no SYS_TIME. The image's own
    # entrypoint writes a config of its own; chrony/chrony.conf replaces it, and /run/chrony
    # is prepared the way that entrypoint would, or chronyd disables its command socket.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        install -d -o chrony -g chrony -m 0750 /run/chrony &&
        exec /usr/sbin/chronyd -u chrony -d -x -f /kenlens/chrony.conf
    ports:
      - "123:123/udp"
    volumes:
      - ./chrony/chrony.conf:/kenlens/chrony.conf:ro
      - ./config/ntp:/kenlens/sources:ro
    healthcheck:
      # Answers whether chronyd is up, not whether it has an upstream: with none it serves this
      # host's clock at stratum 10, which is what an air-gapped site gets. The server's `ntp`
      # health check says which of the two it is.
      test: ["CMD", "chronyc", "-n", "tracking"]
      interval: 10s
      timeout: 3s
      retries: 5

  kenlens-server:
    image: ${KENLENS_IMAGE_REPO:-ghcr.io/kenlens-rtls}/kenlens-server:${KENLENS_VERSION:?set KENLENS_VERSION in .env, e.g. v0.1.30}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    # The host side is KENLENS_HTTPS_PORT (kenlens-setup.sh asks for it; 8443 unless given); the
    # container always listens on 8443, which Tls__HttpsPort and the healthcheck below name.
    ports:
      - "${KENLENS_HTTPS_PORT:-8443}:8443"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Clear the image's ASPNETCORE_URLS so it cannot override the Kestrel binding in
      # Program.cs, which enforces TLS 1.2+ and the cipher allow-list.
      ASPNETCORE_URLS: ""
      Tls__HttpsPort: "8443"
      Server__Cert__Path: /app/config/secrets/server-cert.pfx
      # ConnectionStringBuilder assembles Host=postgres from db-password and, in
      # Production, appends SSL Mode=Require with this file as the root certificate.
      Db__Ca__Path: /app/config/secrets/db-ca.crt
      # Mqtt__Embedded__* describe this bundled broker to the MQTT settings page: the names
      # anchors reach it at (the broker certificate's, from kenlens-setup.sh) and whether the
      # anonymous listener is on. The server itself reaches it as mqtt-broker.
      Mqtt__Embedded__AnchorHosts: ${KENLENS_HOST:-}
      # First-start value of the anonymous-listener switch; afterwards the stored setting wins.
      Mqtt__Embedded__AnonymousListener: ${MQTT_ANONYMOUS_LISTENER:-false}
      # Where the server tells the broker whether the anonymous listener is on. The plugin
      # admin's password is config/secrets/mqtt-admin-password.
      Mqtt__Embedded__ControlDirectory: /app/data/broker-control
      DataProtection__KeysPath: /app/data/keys
      DataProtection__CertificatePath: /app/config/dataprotection/key-ring.crt
      DataProtection__CertificateKeyPath: /app/config/dataprotection/key-ring.key
      FloorPlans__AssetPath: /app/data/floor-plans
      Firmware__AssetPath: /app/data/firmware
      # Health check only (issue #232): whether the anchors' time server answers, and from what.
      Ntp__Host: ntp
      # Issue #234: the server issues and renews every anchor's console certificate over MQTT,
      # signing with the name-constrained anchor console CA. db-ca.crt is the CA it chains to.
      AnchorConsole__CaCertificatePath: /app/config/anchor-ca/anchor-console-ca.crt
      AnchorConsole__CaKeyPath: /app/config/anchor-ca/anchor-console-ca.key
      AnchorConsole__RootCertificatePath: /app/config/secrets/db-ca.crt
      # Issue #242: the KenLens CA, offered to browsers to trust (https://<host>:8443/trust).
      KenLensCa__CertificatePath: /app/config/secrets/db-ca.crt
      # The height tags are carried at, in metres, which the planar solve holds fixed. 1.2 m
      # unless .env says otherwise (KENLENS_TAG_HEIGHT_METRES, or kenlens-setup.sh --tag-height).
      # A height off by 20 cm moves a position by centimetres at the room's centre and by a few
      # tens of centimetres directly under an anchor (issue #248).
      Positioning__AssumedTagHeightMetres: ${KENLENS_TAG_HEIGHT_METRES:-1.2}
    healthcheck:
      # The image's own HEALTHCHECK probes :8080, which Production does not bind. -k skips
      # only the name check for this loopback probe.
      test: ["CMD-SHELL", "curl -fsSk https://localhost:8443/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12
    volumes:
      # Sanitized floor-plan images; the database stores only their file names, so back
      # this up with the database (or use the configuration-export archive, which embeds
      # the bytes).
      - ./data/floor-plans:/app/data/floor-plans
      # Uploaded firmware images (Story 12.2), named by their SHA-256. Not in the
      # configuration-export archive: re-upload them from the release if this is lost.
      - ./data/firmware:/app/data/firmware
      # The Data Protection key ring; see the header.
      - ./data/keys:/app/data/keys
      - kenlens-broker-control:/app/data/broker-control
      - ./logs:/app/logs
      - ./config/dataprotection:/app/config/dataprotection:ro
      - ./config/anchor-ca:/app/config/anchor-ca:ro
      # FileBackedSecretsProvider reads each file as a config key; startup fails fast if a
      # required one is missing or empty.
      - ./config/secrets:/app/config/secrets:ro

volumes:
  kenlens-postgres-data:
  kenlens-mosquitto-data:
  kenlens-broker-control:
