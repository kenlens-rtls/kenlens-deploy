# KenLens Postgres client authentication.
#
# Network clients must use TLS: there is no plain `host` line, so a non-TLS connection
# finds no matching rule and is refused. The Unix socket stays open to the container
# itself — the image's init scripts and the healthcheck's pg_isready use it.
#
# TYPE    DATABASE  USER  ADDRESS  METHOD
local     all       all            trust
hostssl   all       all   all      scram-sha-256
# Story 6.7 — the backup service copies the live database over the replication protocol, which a rule
# naming `all` databases does not match.
hostssl   replication kenlens all    scram-sha-256
