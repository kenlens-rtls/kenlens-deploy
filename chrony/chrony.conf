# NTP for the anchors (issue #232). Anchor firmware 0.7.0 and later checks the dates on the
# broker's certificate only once its clock is set, and its one time source is SNTP to the host
# it uses as the broker — this host, on UDP 123.
#
# chronyd runs with -x: it serves time and never sets the host's clock, so the container needs
# no SYS_TIME capability. Keep the host's own clock synchronised the usual way (systemd-timesyncd
# on Raspberry Pi OS); when the host clock is off, chrony still answers, but from its own clock.
#
# This file is part of the install bundle and an upgrade replaces it. Site time servers go in
# config/ntp/ instead, one file ending in .sources, holding lines such as
#   server ntp.example.lan iburst

# Public time servers, for a site with Internet access. Unreachable, they are simply unused.
pool pool.ntp.org iburst

# Site time servers (config/ntp/*.sources); re-read by `chronyc reload sources`.
sourcedir /kenlens/sources

# With no upstream reachable, answer from this host's clock at stratum 10 rather than with
# stratum 0, which an anchor rejects. On a host with no battery-backed clock (a Raspberry Pi)
# that is whatever time the host booted with, and anchors trust it: give such a host an RTC or
# an upstream server.
local stratum 10

# Any client that reaches UDP 123 may ask; restrict who can at the firewall.
allow all
